<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookshelf</title>
<meta name="description" content="Shared reading tracker with automatic series-release watching">
<!-- Newsreader for titles and headings; everything else uses the system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,400..500&display=swap">
<link rel="stylesheet" href="./app/ui/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23a2461f'/><path d='M7 6.5A1.2 1.2 0 0 1 8.2 5.3H17v11H8.2A1.2 1.2 0 0 0 7 17.5zM7 17.5a1.2 1.2 0 0 0 1.2 1.2H17v-2.4' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/></svg>">

<!-- Match the browser chrome to the page in both themes. -->
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110f" media="(prefers-color-scheme: dark)">
<!-- Behave like an app when added to a phone's home screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Phone only: an app bar holding the menu button. -->
  <header class="topbar">
    <button id="menu-toggle" class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="sidebar"><span class="ico ico-menu" aria-hidden="true"></span></button>
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7h6"/></svg></span> Bookshelf</div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Profiles and views">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7h6"/></svg></span> Bookshelf</div>
      <div id="nav" class="nav"></div>
      <div class="sidebar-foot">
        <button id="open-settings" class="link-btn"><span class="ico ico-settings" aria-hidden="true"></span>Settings</button>
        <span id="sync-state" class="sync" aria-live="polite"></span>
      </div>
    </nav>
    <!-- Phone only: tapping outside the open menu closes it. -->
    <button id="nav-scrim" class="scrim" type="button" tabindex="-1" aria-label="Close menu"></button>

    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <!-- Add-a-book dialog -->
  <dialog id="add-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="add-title">Add a book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body">
      <label class="field">
        <span>Title</span>
        <input id="add-query" type="search" placeholder="Start typing a title…"
               autocomplete="off" spellcheck="false">
      </label>
      <p id="add-hint" class="hint">Search Hardcover for the book you mean.</p>
      <div id="add-results" class="results" role="listbox" aria-label="Search results"></div>
    </div>
  </dialog>

  <!-- Book detail / edit dialog -->
  <dialog id="book-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="book-title">Book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="book-body" class="dialog-body"></div>
  </dialog>

  <!-- Everything known about a forthcoming book -->
  <dialog id="release-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="release-title">Book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="release-body" class="dialog-body"></div>
  </dialog>

  <!-- Recommend a book to someone else -->
  <dialog id="rec-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="rec-title">Recommend a book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="rec-body" class="dialog-body"></div>
  </dialog>

  <!-- Bulk read-date entry -->
  <dialog id="dates-dialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h2 id="dates-title">When did you read these?</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body" id="dates-body"></div>
  </dialog>

  <!-- Settings dialog -->
  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2>Settings</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body" id="settings-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:1rem">Bookshelf needs JavaScript to search for books and show your shelf.</p>
  </noscript>

  <script>
    // Fail loudly rather than showing a blank page on a browser too old to run
    // the app. Everything here is ES5 so it parses anywhere.
    (function () {
      var ok = typeof Promise === 'function' &&
               typeof structuredClone === 'function' &&
               typeof window.HTMLDialogElement === 'function' &&
               !!window.HTMLDialogElement.prototype.showModal &&
               'noModule' in document.createElement('script');
      if (ok) return;
      document.addEventListener('DOMContentLoaded', function () {
        var m = document.getElementById('main');
        if (m) {
          m.innerHTML = '<div class="card"><h2>This browser is a little too old</h2>' +
            '<p>Bookshelf needs a browser from 2022 or later &mdash; iOS 15.4+, or a recent ' +
            'Chrome, Firefox, Edge or Safari. Updating should be all it takes.</p></div>';
        }
      });
    })();
  </script>

  <script type="module" src="./app/ui/main.js"></script>
</body>
</html>
