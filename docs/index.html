<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookshelf</title>
<meta name="description" content="Shared reading tracker with automatic series-release watching">
<link rel="stylesheet" href="./app/ui/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>📚</text></svg>">

<!-- Match the browser chrome to the page in both themes. -->
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<!-- Behave like an app when added to a phone's home screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <button id="menu-toggle" class="menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Profiles and views">
      <div class="brand"><span class="brand-mark">📚</span> Bookshelf</div>
      <div id="nav" class="nav"></div>
      <div class="sidebar-foot">
        <button id="open-settings" class="link-btn">Settings</button>
        <span id="sync-state" class="sync" aria-live="polite"></span>
      </div>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <!-- Add-a-book dialog -->
  <dialog id="add-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="add-title">Add a book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body">
      <label class="field">
        <span>Title</span>
        <input id="add-query" type="search" placeholder="Start typing a title…"
               autocomplete="off" spellcheck="false">
      </label>
      <p id="add-hint" class="hint">Search Hardcover for the book you mean.</p>
      <div id="add-results" class="results" role="listbox" aria-label="Search results"></div>
    </div>
  </dialog>

  <!-- Book detail / edit dialog -->
  <dialog id="book-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="book-title">Book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="book-body" class="dialog-body"></div>
  </dialog>

  <!-- Everything known about a forthcoming book -->
  <dialog id="release-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="release-title">Book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="release-body" class="dialog-body"></div>
  </dialog>

  <!-- Recommend a book to someone else -->
  <dialog id="rec-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="rec-title">Recommend a book</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div id="rec-body" class="dialog-body"></div>
  </dialog>

  <!-- Bulk read-date entry -->
  <dialog id="dates-dialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h2 id="dates-title">When did you read these?</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body" id="dates-body"></div>
  </dialog>

  <!-- Settings dialog -->
  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h2>Settings</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body" id="settings-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:1rem">Bookshelf needs JavaScript to search for books and show your shelf.</p>
  </noscript>

  <script>
    // Fail loudly rather than showing a blank page on a browser too old to run
    // the app. Everything here is ES5 so it parses anywhere.
    (function () {
      var ok = typeof Promise === 'function' &&
               typeof structuredClone === 'function' &&
               typeof window.HTMLDialogElement === 'function' &&
               !!window.HTMLDialogElement.prototype.showModal &&
               'noModule' in document.createElement('script');
      if (ok) return;
      document.addEventListener('DOMContentLoaded', function () {
        var m = document.getElementById('main');
        if (m) {
          m.innerHTML = '<div class="card"><h2>This browser is a little too old</h2>' +
            '<p>Bookshelf needs a browser from 2022 or later &mdash; iOS 15.4+, or a recent ' +
            'Chrome, Firefox, Edge or Safari. Updating should be all it takes.</p></div>';
        }
      });
    })();
  </script>

  <script type="module" src="./app/ui/main.js"></script>
</body>
</html>
