name: Check for new releases

on:
  schedule:
    # 13:07 UTC daily. Deliberately not on the hour — every cron job in the
    # world fires at :00, and GitHub delays runs when the queue is busy.
    - cron: '7 13 * * *'
  workflow_dispatch:

# Nothing is committed any more: the shelves and the watcher's state live in
# the accounts database, read and written through the API's service key.
permissions:
  contents: read

concurrency:
  group: release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # One shelf a minute: twenty people is about twenty minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The diff engine decides what gets announced, so a regression here means
      # wrong or missing alerts. Cheap to run, so run it every time.
      - name: Run tests
        run: node --test test/watch.test.js

      - name: Check each shelf in turn
        env:
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
          BOOKSHELF_API: ${{ vars.BOOKSHELF_API }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: node src/run-check-api.js
